<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WhatsApp</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="./img/icons8-whatsapp-48.png">
    <link rel="manifest" href="manifest.json">
</head>

<body>
    <div class="container">
        <div class="whatsapp">
            <div class="contacts">
                <div class="connav navs">
                    <div class="profile">
                        <img src="./img/109316527.jpg" alt="">
                    </div>
                    <div class="tools">
                        <div class="tool">
                            <img src="./img/icons8-people-64.png" alt="">
                        </div>
                        <div class="tool">
                            <img src="./img/icons8-loading-50.png" alt="">
                        </div>
                        <div class="tool">
                            <img src="./img/icons8-typing-96.png" alt="">
                        </div>
                        <div class="tool">
                            <img src="./img/icons8-menu-vertical-50.png" alt="">
                        </div>
                    </div>
                </div>
                <div class="window blue">
                    <div class="winicon">
                        <img src="./img/icons8-notification-off-96.png" alt="">
                    </div>
                    <div class="wininfo">
                        <div>
                            <p>Être averti·e en cas de nouveaux messages</p>
                        </div>
                        <div>
                            <p>Activer les notifications sur le bureau</p>
                            <img src="./img/icons8-arrow-96.png" alt="">
                        </div>
                    </div>
                    <div class="winclose">
                        <img src="./img/icons8-close-90.png" alt="">
                    </div>
                </div>
                <div class="search">
                    <div class="searchBar">
                        <img src="./img/icons8-search-64.png" alt="">
                        <img src="./img/icons8-back-96.png" alt="">
                        <input type="text" name="" id="" placeholder="Rechercher ou démarrer une nouvelle discussion">
                    </div>
                    <img src="./img/icons8-grip-lines-96.png" alt="">
                </div>
                <div class="usersContainer">
                    <div class="users" id="users-list">
                        <!-- Dynamic Users will be injected here -->
                    </div>
                    <div class="bottomcon">
                        <p>Vos messages personnels sont <a href="#">chiffrés de bout en bout</a></p>
                    </div>
                </div>
            </div>
            <div class="conversation">
                <div class="convenav navs">
                    <div class="conveuser">
                        <div class="profile">
                            <img src="./img/tumblr_ovlq7qnBBR1uebi0uo1_1280.jpg" alt="">
                        </div>
                        <div class="profileInformation">
                            <h4>Ihsan</h4>
                            <p>en ligne hier à 10:56 AM</p>
                        </div>
                    </div>
                    <div class="tools">
                        <div class="tool">
                            <!-- Voice Selector -->
                            <select id="voice-select" class="voice-select" aria-label="Choose a voice for TTS">
                                <option value="sonic-english">Sonic (English)</option>
                                <option value="barbershop-man">Barbershop Man</option>
                            </select>
                        </div>
                        <div class="tool">
                            <!-- Language Selector -->
                            <select id="target-language-select" class="voice-select" style="max-width: 8rem;">
                                <!-- Populated by JS -->
                            </select>
                        </div>
                        <div class="tool">
                            <img src="./img/icons8-menu-vertical-50.png" alt="">
                        </div>
                    </div>
                </div>
                <div class="convemessages" id="chat-container">
                    <!-- Dynamic Messages will appear here -->
                </div>
                <div class="convebottom">
                    <div class="tools">
                        <div class="tool">
                            <img src="./img/icons8-smiling-90.png" alt="">
                        </div>
                        <div class="tool">
                            <img src="./img/icons8-attach-100.png" alt="">
                        </div>
                    </div>
                    <input type="text" placeholder="Taper un message" id="message-input">
                    <div class="tool" id="send-btn" style="position: relative;">
                        <img src="./img/icons8-microphone-96.png" alt="">
                        <!-- Visualizer Canvas -->
                        <canvas id="visualizer" width="50" height="30"
                            style="display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none;"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Login Modal -->
    <div id="login-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Welcome to Classroom</h2>
                <p>Please customize your experience</p>
            </div>

            <div class="modal-body">
                <div class="modal-field">
                    <label>Display Name</label>
                    <input type="text" id="username-input" placeholder="e.g. John Doe">
                </div>

                <div class="modal-field">
                    <label>Room Code</label>
                    <input type="text" id="room-code-input" value="succes" placeholder="Room Code">
                </div>

                <div class="modal-row">
                    <div class="modal-field">
                        <label>Language</label>
                        <select id="modal-language-select"></select>
                    </div>
                    <div class="modal-field">
                        <label>Voice</label>
                        <select id="modal-voice-select">
                            <option value="" disabled selected>Loading voices...</option>
                        </select>
                    </div>
                </div>

                <button id="join-btn">Join Classroom</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-analytics.js"></script>

    <script type="module" src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then(reg => console.log('SW Registered!', reg))
                    .catch(err => console.log('SW Failed', err));
            });
        }
    </script>
</body>

</html>
