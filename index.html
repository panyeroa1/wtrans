}

async connect() {
const name = document.getElementById('user-display-name').value.trim();
const room = document.getElementById('room-code').value.trim().toUpperCase();
if (!name) {
this.showToast('Please enter a display name', 'error');
return;
}

this.userData = {
name: name.substring(0, 20),
room: room || 'SUCCESS',
gender: document.getElementById('user-gender').value,
language: document.getElementById('user-lang').value
};

this.myUserId = `user-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`;
this.joinTimestamp = Date.now();

this.ui.gatewayModal.classList.add('hidden');
this.ui.appContainer.classList.remove('opacity-0');

this.ui.roomHeaderName.textContent = this.userData.room;
this.ui.sidebarRoomName.textContent = this.userData.room;
this.ui.userDisplayMeta.textContent = `${this.userData.name} • ${this.userData.gender} • ${this.userData.language.toUpperCase()}`;

document.getElementById('user-initial').textContent = this.userData.name.charAt(0).toUpperCase();
document.getElementById('user-name').textContent = this.userData.name;

document.body.classList.add('mobile-chat-open');

await this.initializeChat();
this.showToast(`Welcome to ${this.userData.room}!`, 'success');
}

async initializeChat() {
this.ui.msgStream.innerHTML = '';
this.setupFirebaseListeners();
}

setupFirebaseListeners() {
const messagesRef = ref(db, `chats/${this.userData.room}/messages`);
onChildAdded(messagesRef, (snapshot) => {
const message = snapshot.val();
if (message.senderId === this.myUserId) return;

if (message.isRaisedHand) {
this.showRaisedHandNotification(message.senderName);
return;
}

this.renderMessage(message, false);
});
}

showToast(message, type = 'info') {
Toastify({
text: message,
duration: 3000,
gravity: "top",
position: "right",
className: `custom-toast ${type}`,
stopOnFocus: true,
style: {
background: type === 'error' ? '#ef4444' :
type === 'success' ? '#10b981' :
type === 'warning' ? '#f59e0b' : '#3b82f6'
}
}).showToast();
}

handleInputChange() {
const hasText = this.ui.textInput.value.trim() !== '';
this.ui.sendBtn.classList.toggle('hidden', !hasText);
}

scrollToBottom() {
setTimeout(() => {
this.ui.msgStream.scrollTop = this.ui.msgStream.scrollHeight;
}, 100);
}

renderMessage(message, isOwnMessage) {
if (message.isRaisedHand) return;
const messageDiv = document.createElement('div');
messageDiv.className = `flex ${isOwnMessage ? 'justify-end' : 'justify-start'} animate-slide-in`;

const displayText = message.text;
const time = new Date(message.timestamp);
const timeString = time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

messageDiv.innerHTML = `
<div class="${isOwnMessage ? 'bg-[#d9fdd3] rounded-tr-none' : 'bg-white rounded-tl-none'}
p-3 rounded-2xl bubble-shadow max-w-[85%] md:max-w-[70%]
${isOwnMessage ? 'border-l-4 border-[#00a884]' : 'border-l-4 border-blue-400'}">
<div class="flex-1">
${!isOwnMessage ? `
<div class="flex items-center gap-2 mb-1">
<span class="text-xs font-bold text-gray-700">${message.senderName}</span>
<span class="text-[10px] text-gray-500">${message.gender} • ${message.lang}</span>
</div>
` : ''}
<p class="text-[14.5px] text-[#111b21] leading-relaxed whitespace-pre-wrap break-words">
${displayText}
</p>
<div class="flex items-center justify-between mt-2 pt-2 border-t border-gray-100/50">
<div class="flex items-center gap-2">
<span class="text-[10px] text-gray-400">${timeString}</span>
<div class="emotion-emoji" title="${message.emotion || 'neutral'}">
${message.emoji || '😐'}
</div>
</div>
</div>
</div>
</div>
`;

this.ui.msgStream.appendChild(messageDiv);
this.scrollToBottom();
}

async sendTextMessage() {
const text = this.ui.textInput.value.trim();
if (!text) return;

const message = {
text,
senderId: this.myUserId,
senderName: this.userData.name,
gender: this.userData.gender,
lang: this.userData.language,
emoji: '💬',
timestamp: Date.now(),
messageId: `msg-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`
};

this.renderMessage(message, true);

const messageRef = push(ref(db, `chats/${this.userData.room}/messages`));
await set(messageRef, message);

this.ui.textInput.value = '';
this.handleInputChange();
}

raiseHand() {
const message = {
text: "raised their hand",
senderId: this.myUserId,
senderName: this.userData.name,
gender: this.userData.gender,
lang: this.userData.language,
emoji: "✋",
timestamp: Date.now(),
messageId: `hand-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`,
isRaisedHand: true
};

const messageRef = push(ref(db, `chats/${this.userData.room}/messages`));
set(messageRef, message);

this.showRaisedHandNotification(this.userData.name);
}

showRaisedHandNotification(name) {
this.raisedHandText.textContent = `${name} raised their hand!`;
this.raisedHandNotification.classList.add('show');
setTimeout(() => {
this.raisedHandNotification.classList.remove('show');
}, 3000);
}

toggleTTS() {
this.ttsEnabled = !this.ttsEnabled;
this.ui.ttsIcon.className = this.ttsEnabled ?
"fas fa-volume-high text-[#008069]" :
"fas fa-volume-mute text-gray-400";
this.showToast(
this.ttsEnabled ? 'Text-to-speech enabled' : 'Text-to-speech disabled',
this.ttsEnabled ? 'success' : 'info'
);
}

async clearChat() {
await remove(ref(db, `chats/${this.userData.room}`));
this.ui.msgStream.innerHTML = '';
this.showToast('Chat cleared successfully', 'success');
}

logout() {
if (confirm('Are you sure you want to logout?')) {
location.reload();
}
}
}

document.addEventListener('DOMContentLoaded', () => {
window.app = new SuccesClassApp();
});
</script>
</body>
</html>
