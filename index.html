            overflow: hidden; 
            touch-action: manipulation;

            font-size: 16px !important; 
            touch-action: manipulation; 
        }
        
        .chat-bg { 
            background-color: #efeae2;

        }
        
        /* Message Bubbles */
        .msg-me { background-color: #d9fdd3; align-self: flex-end; border-top-right-radius: 0; }

        .msg-container-other { justify-content: flex-start; }

        .mic-disabled { opacity: 0.4; pointer-events: none; background-color: #e5e7eb !important; color: #9ca3af !important; }
        
        /* Mobile Responsive View Logic */

            #sidebar { position: absolute; width: 100%; height: 100%; z-index: 40; transform: translateX(-100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }

            .sidebar-open #chat-main { display: none; } /* Optimization */

                <button id="btn-connect" class="w-full bg-[#00a884] text-white font-bold py-4 rounded-xl shadow-lg hover:bg-[#008069] transition-all uppercase tracking-widest mt-2">

            </div>
        </div>
    </div>

        let isRec = false, mediaRec, dgConnection, tStart, tInt, activeSegmentRef = null;

        let isHandRaised = false, currentSpeaker = null;

        const ui = {
            modal: document.getElementById('gateway-modal'), delModal: document.getElementById('delete-modal'), app: document.getElementById('app-container'), langSelect: document.getElementById('user-lang'), msgWin: document.getElementById('msg-stream'), txtIn: document.getElementById('text-input'), sendBtn: document.getElementById('send-btn'), 
            micBtn: document.getElementById('mic-btn'), handBtn: document.getElementById('hand-btn'),
            voiceOver: document.getElementById('voice-overlay'), livePreview: document.getElementById('live-preview'), timer: document.getElementById('timer'), viz: document.getElementById('viz'), ttsBtn: document.getElementById('tts-toggle-btn'), ttsIcon: document.getElementById('tts-icon'), logout: document.getElementById('logout-btn'),
            banner: document.getElementById('speaker-banner'), bannerText: document.getElementById('speaker-text'), handsList: document.getElementById('hands-list'), handsListContainer: document.getElementById('hands-list-container')
        };

        // --- SEQUENTIAL AUDIO QUEUE (TTS) ---
        async function processAudioQueue() {
            if (isAudioPlaying || audioQueue.length === 0) return;
            isAudioPlaying = true;
            ui.ttsIcon.parentElement.classList.add('audio-playing'); // Add pulse animation
            
            const item = audioQueue.shift();
            try {
                const pair = VOICE_MAP[item.lang] || DEFAULT_VOICES;
                const vId = pair[item.gender] || DEFAULT_VOICES[item.gender];
                
                const res = await fetch("https://api.cartesia.ai/tts/bytes", {
                    method: "POST",
                    headers: { "Cartesia-Version": "2025-04-16", "X-API-Key": CARTESIA_KEY, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        "model_id": "sonic-3-latest",
                        "transcript": `<emotion value="${item.emotion || 'neutral'}" />${item.text}`,
                        "voice": { "mode": "id", "id": vId },
                        "output_format": { "container": "wav", "encoding": "pcm_f32le", "sample_rate": 44100 },
                        "speed": "normal",
                        "generation_config": { "speed": 1, "volume": 1, "emotion": item.emotion || "neutral" }
                    })
                });

                if (res.ok) {
                    const audio = new Audio(URL.createObjectURL(await res.blob()));
                    audio.onended = () => { 
                        isAudioPlaying = false; 
                        ui.ttsIcon.parentElement.classList.remove('audio-playing');
                        processAudioQueue(); 
                    };
                    await audio.play();
                } else { 
                    isAudioPlaying = false; 
                    ui.ttsIcon.parentElement.classList.remove('audio-playing');
                    processAudioQueue(); 
                }
            } catch (e) { 
                isAudioPlaying = false; 
                ui.ttsIcon.parentElement.classList.remove('audio-playing');
                processAudioQueue(); 
            }
        }

        // --- UTILS & CLEANING ---
        function cleanTranscript(t) { return t.replace(/\b(uhm|um|ah|huh|er|eh|hm|uh)\b/gi, "").replace(/\s\s+/g, ' ').trim(); }
        
        async function translate(text, from, to) {
            if (from === to) return text;
            try {
                const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${from}&tl=${to}&dt=t&q=${encodeURI(text)}`);
                const d = await res.json(); return d[0][0][0];
            } catch (e) { return text; }
        }

        function getEmotion(text) {
            const l = text.toLowerCase();
            if (l.includes("happy") || l.includes("good")) return "happy";
            if (l.includes("sad") || l.includes("bad")) return "sad";
            if (l.includes("angry") || l.includes("mad")) return "angry";
            if (l.includes("sorry")) return "apologetic";
            if (l.includes("wow")) return "amazed";
            return "neutral"; 
        }

        // --- FIREBASE OPS ---
        function pushMsg(raw, isFinal = true) {
            const text = cleanTranscript(raw); if (!text) return;
            const emotion = isFinal ? getEmotion(text) : "neutral";
            const path = isFinal ? `chats/${userData.room}/messages` : `chats/${userData.room}/drafts`;
            const tRef = isFinal ? push(ref(db, path)) : (activeSegmentRef || push(ref(db, path)));
            if (!isFinal) activeSegmentRef = tRef;

            set(tRef, { text, senderId: myUserId, senderName: userData.name, gender: userData.gender, lang: userData.language, emotion, emoji: EMOTIONS[emotion] || '😐', timestamp: Date.now() });
            if (isFinal && activeSegmentRef) { remove(activeSegmentRef); activeSegmentRef = null; }
        }

        function bindFirebase(room) {
            ui.msgWin.innerHTML = '';
            // 1. MESSAGES LISTENER
            onChildAdded(ref(db, `chats/${room}/messages`), async (snap) => {
                const msg = snap.val();
                if (msg.senderId !== myUserId && msg.timestamp >= joinTimestamp) {
                    msg.translated = await translate(msg.text, msg.lang, userData.language);
                    audioQueue.push({ text: msg.translated, gender: msg.gender, emotion: msg.emotion, lang: userData.language });
                    if(ttsEnabled) processAudioQueue();
                }
                renderBubble(msg);
            });
            onValue(ref(db, `chats/${room}/drafts`), (snap) => {
                document.querySelectorAll('.is-live').forEach(el => el.remove());
                if (snap.val()) Object.entries(snap.val()).forEach(([key, val]) => renderBubble(val, true));
            });

            // 2. SPEAKER LOCK LISTENER
            onValue(ref(db, `chats/${room}/speaker`), (snap) => {
                currentSpeaker = snap.val();
                if (currentSpeaker) {
                    ui.banner.classList.remove('hidden');
                    if (currentSpeaker.id === myUserId) {
                        ui.banner.classList.remove('bg-blue-600'); ui.banner.classList.add('bg-[#008069]');
                        ui.bannerText.innerText = "🎙️ You are speaking...";
                        ui.micBtn.classList.remove('mic-disabled'); // Keep enabled for speaker
                    } else {
                        ui.banner.classList.remove('bg-[#008069]'); ui.banner.classList.add('bg-blue-600');
                        ui.bannerText.innerText = `🔊 ${currentSpeaker.name} is speaking...`;
                        ui.micBtn.classList.add('mic-disabled'); // Disable for others
                    }
                } else {
                    ui.banner.classList.add('hidden');
                    ui.micBtn.classList.remove('mic-disabled');
                }
            });

            // 3. HANDS LISTENER
            onValue(ref(db, `chats/${room}/hands`), (snap) => {
                const hands = snap.val() || {};
                ui.handsList.innerHTML = '';
                const entries = Object.entries(hands);
                ui.handsListContainer.classList.toggle('hidden', entries.length === 0);
                
                isHandRaised = !!hands[myUserId];
                ui.handBtn.classList.toggle('text-yellow-500', isHandRaised);
                ui.handBtn.classList.toggle('bg-yellow-50', isHandRaised);

                entries.forEach(([id, name]) => {
                    const div = document.createElement('div');
                    div.className = "flex items-center gap-2 text-xs bg-white border border-gray-200 p-2 rounded-lg animate-in fade-in zoom-in shadow-sm";
                    div.innerHTML = `<i class="fa-solid fa-hand text-yellow-500"></i> <span class="font-semibold text-gray-700">${name}</span>`;
                    ui.handsList.appendChild(div);
                });
            });
        }

        function renderBubble(msg, isLive = false) {
            const isMe = msg.senderId === myUserId;
            const div = document.createElement('div');
            div.className = `flex w-full mb-1 ${isMe ? 'msg-container-me' : 'msg-container-other'} ${isLive ? 'is-live opacity-50' : ''}`;
            
            const display = (!isMe && !isLive && msg.translated) ? msg.translated : msg.text;
            const bubbleClass = isMe ? 'msg-me' : 'msg-other';
            
            div.innerHTML = `
                <div class="${bubbleClass} rounded-2xl p-2 md:p-3 bubble-shadow max-w-[85%] md:max-w-[70%] flex items-end gap-2 relative group text-sm md:text-base">
                    <div class="flex-1">
                        ${!isMe ? `<p class="text-[10px] font-bold text-teal-600 leading-tight mb-1">${msg.senderName}</p>` : ''}
                        <p class="text-[#111b21] leading-snug pr-1 pb-1 break-words">${display}</p>
                        <div class="flex items-center gap-1 justify-end opacity-50">
                            <span class="text-[9px] font-medium uppercase tracking-tighter">${new Date(msg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                        </div>
                    </div>
                </div>`;
            ui.msgWin.appendChild(div); ui.msgWin.scrollTop = ui.msgWin.scrollHeight;
        }

        // --- HANDS LOGIC ---
        ui.handBtn.onclick = () => {
            if(isHandRaised) {
                remove(ref(db, `chats/${userData.room}/hands/${myUserId}`));
            } else {
                set(ref(db, `chats/${userData.room}/hands/${myUserId}`), userData.name);
            }
        };

        // --- NEW DEEPGRAM LOGIC WITH SDK ---
        async function startVoice() {
            // CHECK LOCK FIRST
            if (currentSpeaker && currentSpeaker.id !== myUserId) {
                alert("Please wait for your turn!");
                return;
            }

            try {
                // SET LOCK
                const speakerRef = ref(db, `chats/${userData.room}/speaker`);
                await set(speakerRef, { id: myUserId, name: userData.name });
                onDisconnect(speakerRef).remove(); // Safety: Unlock if crash

                // IF HAND WAS RAISED, LOWER IT
                if(isHandRaised) remove(ref(db, `chats/${userData.room}/hands/${myUserId}`));

                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                isRec = true; 
                ui.voiceOver.classList.remove('hidden'); 
                ui.livePreview.innerText = "Listening...";
                
                // Initialize Visualizer
                setupViz(stream);
                
                tStart = Date.now();
                tInt = setInterval(() => { const s = Math.floor((Date.now() - tStart)/1000); ui.timer.innerText = `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`; }, 1000);

                const deepgram = createClient(DEEPGRAM_API_KEY);
                let keywords = [];
                if(userData.language === 'nl') keywords = DUTCH_LEXICON_DATA.map(item => item.text);

                dgConnection = deepgram.listen.live({
                    model: 'nova-3',
                    language: userData.language,
                    smart_format: true,
                    interim_results: true,
                    endpointing: 500, 
                    punctuate: true,
                    vad_events: true,
                    keywords: keywords
                });

                dgConnection.on(LiveTranscriptionEvents.Open, () => {
                    mediaRec = new MediaRecorder(stream, { mimeType: 'audio/webm' });
                    mediaRec.ondataavailable = (e) => {
                        if (e.data.size > 0 && dgConnection.getReadyState() === 1) dgConnection.send(e.data);
                    };
                    mediaRec.start(200);
                });

                dgConnection.on(LiveTranscriptionEvents.Transcript, (data) => {
                    if (data.type === 'SpeechStarted') return;
                    const alt = data.channel?.alternatives?.[0];
                    if (alt && alt.transcript) {
                        ui.livePreview.innerText = alt.transcript;
                        pushMsg(alt.transcript, data.is_final);
                    }
                });

                dgConnection.on(LiveTranscriptionEvents.Error, (err) => {
                    console.error("DG Error", err);
                    stopVoice(false);
                });

            } catch (e) { console.error(e); stopVoice(false); }
        }

        function stopVoice(save) {
            // RELEASE LOCK
            remove(ref(db, `chats/${userData.room}/speaker`));

            isRec = false; 
            mediaRec?.stop(); 
            dgConnection?.finish(); 
            clearInterval(tInt); 
            ui.voiceOver.classList.add('hidden'); 
            ui.timer.innerText = "00:00";
            if (!save && activeSegmentRef) { remove(activeSegmentRef); activeSegmentRef = null; }
        }

        // --- APP FLOW ---
        function connect(isAuto) {
            if(!isAuto) {
                const n = document.getElementById('user-display-name').value.trim();
                const r = document.getElementById('room-code').value.trim().toUpperCase();
                if(!n) return alert("Enter Name");
                userData.name = n.substring(0,8); userData.room = r || 'SUCCESS';
                userData.gender = document.getElementById('user-gender').value;
                userData.language = ui.langSelect.value;
                joinTimestamp = Date.now();
                localStorage.setItem('succes_session', JSON.stringify({ ...userData, joinTime: joinTimestamp }));
            }
            ui.modal.classList.add('hidden'); ui.app.classList.remove('opacity-0');
            document.getElementById('room-header-name').innerText = userData.room;
            document.getElementById('sidebar-room-name').innerText = userData.room;
            document.getElementById('user-display-meta').innerText = `${userData.name} • ${userData.gender} • ${userData.language.toUpperCase()}`;
            
            // On mobile, auto-close sidebar after connecting
            if(window.innerWidth < 768) {
                document.body.classList.remove('sidebar-open');
            } else {
                document.body.classList.add('sidebar-open');
            }
            
            bindFirebase(userData.room);
        }

        // --- ENHANCED RESPONSIVE AUDIO VISUALIZER ---
        function setupViz(s) {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const analyser = audioCtx.createAnalyser();
            const source = audioCtx.createMediaStreamSource(s);
            source.connect(analyser);
            
            analyser.fftSize = 128; // Lower FFT for chunkier bars
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            const canvas = ui.viz;
            const canvasCtx = canvas.getContext('2d');

            function resizeCanvas() {
                canvas.width = canvas.parentElement.offsetWidth * window.devicePixelRatio;
                canvas.height = canvas.parentElement.offsetHeight * window.devicePixelRatio;
                canvasCtx.scale(window.devicePixelRatio, window.devicePixelRatio);
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            function draw() {
                if(!isRec) {
                    audioCtx.close(); 
                    window.removeEventListener('resize', resizeCanvas);
                    return;
                }
                
                requestAnimationFrame(draw);
                analyser.getByteFrequencyData(dataArray);

                const width = canvas.parentElement.offsetWidth;
                const height = canvas.parentElement.offsetHeight;
                canvasCtx.clearRect(0, 0, width, height);

                const barWidth = (width / bufferLength) * 2.5;
                let barHeight;
                let x = 0;

                for(let i = 0; i < bufferLength; i++) {
                    barHeight = (dataArray[i] / 255) * height;

                    // Rounded Bars
                    canvasCtx.fillStyle = '#008069';
                    canvasCtx.beginPath();
                    canvasCtx.roundRect(x, (height - barHeight) / 2, barWidth - 1, barHeight, 5);
                    canvasCtx.fill();

                    x += barWidth;
                }
            }
            draw();
        }

        // FULL LANGUAGE LIST POPULATION
        fullLangList.forEach(l => {
            const opt = document.createElement('option');
            const map = { "Dutch": "nl", "Tagalog": "tl", "English": "en", "Spanish": "es", "French": "fr", "German": "de", "Arabic": "ar", "Korean": "ko", "Japanese": "ja", "Portuguese": "pt", "Tamil": "ta", "Telugu": "te", "Hindi": "hi", "Italian": "it", "Russian": "ru", "Swedish": "sv", "Turkish": "tr", "Polish": "pl", "Indonesian": "id", "Vietnamese": "vi", "Chinese (Simplified)": "zh-CN", "Chinese (Traditional)": "zh-TW" };
            opt.value = map[l] || "en"; opt.text = l === "Dutch" ? "Dutch Flemish" : l;
            if(l === "Dutch") opt.selected = true; 
            ui.langSelect.add(opt);
        });

        window.toggleDeleteModal = (show) => ui.delModal.classList.toggle('hidden', !show);
        document.getElementById('confirm-delete-btn').onclick = () => { remove(ref(db, `chats/${userData.room}`)); toggleDeleteModal(false); ui.msgWin.innerHTML = ''; };
        ui.logout.onclick = () => { localStorage.removeItem('succes_session'); localStorage.removeItem('succes_uid'); location.reload(); };
        document.getElementById('btn-connect').onclick = () => connect(false);
        ui.ttsBtn.onclick = () => { ttsEnabled = !ttsEnabled; ui.ttsIcon.className = ttsEnabled ? "fa-solid fa-volume-high text-[#008069]" : "fa-solid fa-volume-xmark text-gray-500"; if(ttsEnabled) processAudioQueue(); };
        ui.txtIn.oninput = () => { const v = ui.txtIn.value.trim(); ui.sendBtn.classList.toggle('hidden', v===""); ui.micBtn.classList.toggle('hidden', v!==""); };
        ui.sendBtn.onclick = () => { if(ui.txtIn.value.trim()){ pushMsg(ui.txtIn.value.trim(), true); ui.txtIn.value=''; ui.txtIn.oninput(); } };
        ui.micBtn.onclick = startVoice;
        document.getElementById('stop-voice').onclick = () => stopVoice(true);
        document.getElementById('cancel-voice').onclick = () => stopVoice(false);

        const saved = localStorage.getItem('succes_session');
        if(saved) { const d = JSON.parse(saved); userData = d; joinTimestamp = d.joinTime; connect(true); }
    </script>
</body>
</html>
