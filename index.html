<!DOCTYPE html>

    body {

      overflow: hidden;
      touch-action: manipulation;

      .mobile-chat-open #sidebar { transform: translateX(-100%); }
    }

    .bubble-shadow { box-shadow: 0 1px 0.5px rgba(0,0,0,0.15); }
    .emotion-emoji { font-size: 1.25rem; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.1)); }
    .rounded-tl-none { border-top-left-radius: 0 !important; }
    .rounded-tr-none { border-top-right-radius: 0 !important; }

    /* Emoji Picker */
    .emoji-picker {
      position: absolute;
      bottom: 80px;
      left: 10px;
      width: 300px;
      height: 250px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      z-index: 1000;
      display: none;
      grid-template-columns: repeat(8, 1fr);
      gap: 5px;
      padding: 10px;
      overflow-y: auto;
    }
    .emoji-item {
      font-size: 1.2rem;
      cursor: pointer;
      text-align: center;
      padding: 5px;
      border-radius: 8px;
      transition: all 0.2s;
      user-select: none;
    }
    .emoji-item:hover { background: #f0f2f5; transform: scale(1.15); }

    /* Raise-hand active */
    .hand-active {
      color: #00a884 !important;
      filter: drop-shadow(0 2px 6px rgba(0,168,132,0.35));

    /* Sidebar sections */
    .side-section-title {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: #9ca3af;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;

    .mini-pill {
      font-size: 10px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 999px;
      background: #eef2f7;
      color: #374151;
      letter-spacing: .08em;

    .history-item {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 8px;
      border-radius: 10px;

      cursor: pointer;

    .history-item:hover { background: #f7fafc; }
    .history-avatar {

      height: 28px;
      border-radius: 999px;

      align-items: center;
      justify-content: center;
      color: white;
      font-size: 11px;
      font-weight: 800;
      flex: 0 0 auto;

    .history-meta { font-size: 10px; color: #6b7280; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .history-text { font-size: 12px; color: #111827; line-height: 1.2; margin-top: 2px; }

    .hand-row {

      justify-content: space-between;

      border-radius: 10px;

</head>

    // =========================================================
    // AUDIO QUEUE (TTS)
    // =========================================================
    async function processAudioQueue() {
      if (isAudioPlaying || audioQueue.length === 0) return;
      isAudioPlaying = true;

      const item = audioQueue.shift();
      try {
        const pair = VOICE_MAP[item.lang] || DEFAULT_VOICES;
        const vId = pair[item.gender] || DEFAULT_VOICES[item.gender];

        const response = await fetch("https://api.cartesia.ai/tts/bytes", {
          method: "POST",
          headers: {
            "Cartesia-Version": CARTESIA_VERSION,
            "X-API-Key": CARTESIA_KEY,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model_id: "sonic-3-latest",
            transcript: `<emotion value="${item.emotion || 'neutral'}" />${item.text}`,
            voice: { mode: "id", id: vId },
            output_format: { container: "wav", encoding: "pcm_f32le", sample_rate: 44100 },
            speed: "normal",
            generation_config: { speed: 1, volume: 1, emotion: item.emotion || "neutral" }
          })
        });

        if (!response.ok) {
          console.error("TTS API Error:", response.status);
          isAudioPlaying = false;
          processAudioQueue();
          return;
        }

        const blob = await response.blob();
        const audio = new Audio(URL.createObjectURL(blob));
        audio.onended = () => { isAudioPlaying = false; processAudioQueue(); };
        audio.onerror = () => { isAudioPlaying = false; processAudioQueue(); };

        await audio.play();
      } catch (e) {
        console.error("TTS Processing Error:", e);
        isAudioPlaying = false;
        processAudioQueue();
      }
    }

    // =========================================================
    // UTILS
    // =========================================================
    function cleanTranscript(t) {
      return String(t || "")
        .replace(/\b(uhm|um|ah|huh|er|eh|hm|uh)\b/gi, "")
        .replace(/\s\s+/g, " ")
        .trim();
    }

    function escapeHtml(s) {
      return String(s || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function toSnippet(text, n = 48) {
      const t = cleanTranscript(text);
      return t.length > n ? (t.slice(0, n - 1) + "…") : t;
    }

    async function translate(text, from, to) {
      if (from === to) return text;
      try {
        const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${encodeURIComponent(from)}&tl=${encodeURIComponent(to)}&dt=t&q=${encodeURIComponent(text)}`);
        const d = await res.json();
        return d?.[0]?.[0]?.[0] ?? text;
      } catch (e) {
        console.error("Translation Error:", e);
        return text;
      }
    }

    function getEmotion(text) {
      const l = String(text || "").toLowerCase();
      if (l.includes("happy") || l.includes("good")) return "happy";
      if (l.includes("sad") || l.includes("bad")) return "sad";
      if (l.includes("angry") || l.includes("mad")) return "angry";
      if (l.includes("sorry")) return "apologetic";
      if (l.includes("wow")) return "amazed";
      return "neutral";
    }

    function persistHistory() {
      try {
        const key = `history_${userData.room}`;
        localStorage.setItem(key, JSON.stringify(historyItems.slice(0, HISTORY_MAX)));
      } catch {}
    }

    function loadHistoryFromStorage() {
      try {
        const key = `history_${userData.room}`;
        const raw = localStorage.getItem(key);
        if (!raw) return;
        const arr = JSON.parse(raw);
        if (Array.isArray(arr)) {
          historyItems.length = 0;
          historyItems.push(...arr.slice(0, HISTORY_MAX));
          scheduleHistoryRender();
        }
      } catch {}
    }

    function scheduleHistoryRender() {
      if (historyRenderScheduled) return;
      historyRenderScheduled = true;
      requestAnimationFrame(() => {
        historyRenderScheduled = false;
        renderHistorySidebar();
      });
    }

    function renderHistorySidebar() {
      ui.historyList.innerHTML = "";
      const list = historyItems.slice(0, HISTORY_MAX);

      if (list.length === 0) {
        const empty = document.createElement("div");
        empty.className = "text-xs text-gray-400 font-semibold italic p-2";
        empty.textContent = "No history yet.";
        ui.historyList.appendChild(empty);
        return;
      }

      for (const it of list) {
        const row = document.createElement("div");
        row.className = "history-item";

        const color = it.gender === "Female" ? "bg-pink-500" : "bg-blue-500";
        row.innerHTML = `
          <div class="history-avatar ${color}">${escapeHtml((it.name || "?").charAt(0))}</div>
          <div class="min-w-0 flex-1">
            <div class="history-meta">${escapeHtml(it.name)} • ${escapeHtml(it.lang)}</div>
            <div class="history-text">${escapeHtml(toSnippet(it.text, 56))}</div>
          </div>
        `;

        row.onclick = () => {
          // simple behavior: jump to bottom where latest messages are
          ui.msgWin.scrollTop = ui.msgWin.scrollHeight;
          document.body.classList.add("mobile-chat-open");
        };

        ui.historyList.appendChild(row);
      }
    }

    function addHistoryItem(msg) {
      const item = {
        name: msg.senderName || "Unknown",
        gender: msg.gender || "Male",
        lang: (msg.lang || "en").toUpperCase(),
        text: msg.translated || msg.text || "",
        ts: msg.timestamp || Date.now()
      };

      // prepend newest
      historyItems.unshift(item);
      // trim
      if (historyItems.length > HISTORY_MAX) historyItems.length = HISTORY_MAX;

      persistHistory();
      scheduleHistoryRender();
    }

    // =========================================================
    // RAISE HAND (WORKING)
    // =========================================================
    function handRef(room) { return ref(db, `hands/${room}`); }
    function myHandRef(room) { return ref(db, `hands/${room}/${myUserId}`); }

    async function raiseHand() {
      if (handRaised) return;
      handRaised = true;
      ui.raiseHandBtn.classList.add("hand-active");
      ui.handToggleBtn.textContent = "Raised ✓";

      await set(myHandRef(userData.room), {
        senderId: myUserId,
        senderName: userData.name,
        gender: userData.gender,
        lang: userData.language,
        timestamp: Date.now(),
        status: "raised"
      });
    }

    async function lowerHand() {
      if (!handRaised) return;
      handRaised = false;
      ui.raiseHandBtn.classList.remove("hand-active");
      ui.handToggleBtn.textContent = "Raise Hand";
      try { await remove(myHandRef(userData.room)); } catch {}
    }

    function toggleHand() {
      if (handRaised) return lowerHand();
      return raiseHand();
    }

    function bindHands(room) {
      onValue(handRef(room), (snap) => {
        const data = snap.val() || {};
        const arr = Object.values(data)
          .filter(v => v && v.status === "raised")
          .sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));

        ui.handsCount.textContent = String(arr.length);
        ui.handsList.innerHTML = "";

        if (arr.length === 0) {
          const empty = document.createElement("div");
          empty.className = "text-xs text-gray-400 font-semibold italic p-2";
          empty.textContent = "No hands raised.";
          ui.handsList.appendChild(empty);
          return;
        }

        for (const h of arr) {
          const row = document.createElement("div");
          row.className = "hand-row";

          const color = h.gender === "Female" ? "bg-pink-500" : "bg-blue-500";
          const me = h.senderId === myUserId;

          row.innerHTML = `
            <div class="hand-left min-w-0">
              <div class="history-avatar ${color}">✋</div>
              <div class="min-w-0">
                <div class="hand-name">${escapeHtml(h.senderName || "Unknown")}${me ? " (You)" : ""}</div>
                <div class="hand-sub">${escapeHtml((h.lang || "").toUpperCase())} • ${escapeHtml(h.gender || "")}</div>
              </div>
            </div>
            <div class="hand-actions">
              ${me ? `<button class="lower" data-lower="1">Lower</button>` : ``}
            </div>
          `;

          const lowerBtn = row.querySelector('button[data-lower="1"]');
          if (lowerBtn) lowerBtn.onclick = () => lowerHand();

          ui.handsList.appendChild(row);
        }
      });
    }

    // =========================================================
    // FIREBASE OPS (messages)
    // =========================================================
    function pushMsg(raw, isFinal = true) {
      const text = cleanTranscript(raw);
      if (!text) return;

      const emotion = isFinal ? getEmotion(text) : "neutral";
      const path = isFinal ? `chats/${userData.room}/messages` : `chats/${userData.room}/drafts`;
      const tRef = isFinal ? push(ref(db, path)) : (activeSegmentRef || push(ref(db, path)));
      if (!isFinal) activeSegmentRef = tRef;

      set(tRef, {
        text,
        senderId: myUserId,
        senderName: userData.name,
        gender: userData.gender,
        lang: userData.language,
        emotion,
        emoji: EMOTIONS[emotion] || "😐",
        timestamp: Date.now()
      });

      if (isFinal && activeSegmentRef) {
        remove(activeSegmentRef);
        activeSegmentRef = null;
      }
    }

    function bindFirebase(room) {
      ui.msgWin.innerHTML = "";

      // Hands + History
      bindHands(room);
      loadHistoryFromStorage();

      onChildAdded(ref(db, `chats/${room}/messages`), async (snap) => {
        const msg = snap.val();
        if (!msg) return;

        // Add to sidebar history always (translated if other)
        if (msg.senderId !== myUserId) {
          try {
            msg.translated = await translate(msg.text, msg.lang, userData.language);
          } catch {}
        }

        // TTS for others
        if (msg.senderId !== myUserId && msg.timestamp >= joinTimestamp) {
          audioQueue.push({
            text: msg.translated || msg.text,
            gender: msg.gender,
            emotion: msg.emotion,
            lang: userData.language
          });
          if (ttsEnabled) processAudioQueue();
        }

        renderBubble(msg);
        addHistoryItem(msg);
      });

      onValue(ref(db, `chats/${room}/drafts`), (snap) => {
        document.querySelectorAll(".is-live").forEach(el => el.remove());
        const drafts = snap.val();
        if (!drafts) return;
        Object.entries(drafts).forEach(([_, val]) => renderBubble(val, true));
      });
    }

    function renderBubble(msg, isLive = false) {
      const isMe = msg.senderId === myUserId;
      const div = document.createElement("div");
      div.className = `flex ${isMe ? "justify-end" : "justify-start"} ${isLive ? "is-live opacity-50" : ""}`;

      const display = (!isMe && msg.translated) ? msg.translated : msg.text;

      div.innerHTML = `
        <div class="${isMe ? "bg-[#d9fdd3] rounded-tr-none" : "bg-white rounded-tl-none"} p-2 rounded-lg bubble-shadow max-w-[85%] flex items-end gap-2">
          <div class="flex-1">
            <p class="text-[14.5px] text-[#111b21] leading-tight pr-1 pb-1">${escapeHtml(display)}</p>
            <div class="flex items-center gap-1">
              <span class="text-[8px] text-gray-400 font-bold uppercase tracking-tighter">
                ${escapeHtml(msg.senderName)} • ${escapeHtml(msg.gender)} • ${escapeHtml(msg.lang)}
              </span>
            </div>
          </div>
          <div class="emotion-emoji shrink-0">${escapeHtml(msg.emoji || "😐")}</div>
        </div>
      `;

      ui.msgWin.appendChild(div);
      ui.msgWin.scrollTop = ui.msgWin.scrollHeight;
    }

    // =========================================================
    // DEEPGRAM CONTINUOUS STT
    // =========================================================
    async function startVoice() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

        isRec = true;
        ui.voiceOver.classList.remove("hidden");
        setupViz(stream);

        tStart = Date.now();
        tInt = setInterval(() => {
          const s = Math.floor((Date.now() - tStart) / 1000);
          ui.timer.innerText = `${Math.floor(s/60).toString().padStart(2,"0")}:${(s%60).toString().padStart(2,"0")}`;
        }, 1000);

        const dgClient = createClient(DEEPGRAM_KEY);
        dgSocket = dgClient.listen.live({
          model: "nova-3",
          language: userData.language,
          smart_format: true,
          interim_results: true,
          endpointing: 1000,
          punctuate: true
        });

        dgSocket.on(LiveTranscriptionEvents.Open, () => {
          mediaRec = new MediaRecorder(stream, { mimeType: "audio/webm" });
          mediaRec.ondataavailable = (e) => {
            if (e.data.size > 0 && dgSocket.getReadyState() === 1) dgSocket.send(e.data);
          };
          mediaRec.start(250);
        });

        dgSocket.on(LiveTranscriptionEvents.Transcript, (d) => {
          const txt = d?.channel?.alternatives?.[0]?.transcript || "";
          if (txt.trim()) pushMsg(txt, d.is_final);
        });

      } catch (e) {
        console.error("Voice recording error:", e);
        stopVoice(false);
      }
    }

    function stopVoice(save) {
      isRec = false;
      try { mediaRec?.stop(); } catch {}
      try { dgSocket?.finish(); } catch {}
      clearInterval(tInt);
      ui.voiceOver.classList.add("hidden");
      ui.timer.innerText = "00:00";

      if (!save && activeSegmentRef) {
        remove(activeSegmentRef);
        activeSegmentRef = null;
      }
    }

    function setupViz(s) {
      const vCtx = new AudioContext();
      const aAn = vCtx.createAnalyser();
      aAn.fftSize = 64;
      vCtx.createMediaStreamSource(s).connect(aAn);

      const b = new Uint8Array(aAn.frequencyBinCount);
      const ctx = ui.viz.getContext("2d");
      ui.viz.width = ui.viz.parentElement.offsetWidth;

      const dr = () => {
        if (!isRec) return vCtx.close();
        requestAnimationFrame(dr);
        aAn.getByteFrequencyData(b);
        ctx.clearRect(0, 0, ui.viz.width, ui.viz.height);

        let x = 0;
        for (let i = 0; i < b.length; i++) {
          const h = (b[i] / 255) * 30;
          ctx.fillStyle = "#00a884";
          ctx.beginPath();
          const rectX = x, rectY = (30 - h) / 2, rectW = 2, rectH = h, r = 6;
          ctx.moveTo(rectX + r, rectY);
          ctx.lineTo(rectX + rectW - r, rectY);
          ctx.quadraticCurveTo(rectX + rectW, rectY, rectX + rectW, rectY + r);
          ctx.lineTo(rectX + rectW, rectY + rectH - r);
          ctx.quadraticCurveTo(rectX + rectW, rectY + rectH, rectX + rectW - r, rectY + rectH);
          ctx.lineTo(rectX + r, rectY + rectH);
          ctx.quadraticCurveTo(rectX, rectY + rectH, rectX, rectY + rectH - r);
          ctx.lineTo(rectX, rectY + r);
          ctx.quadraticCurveTo(rectX, rectY, rectX + r, rectY);
          ctx.closePath();
          ctx.fill();
          x += 5;
        }
      };
      dr();
    }

    // =========================================================
    // EMOJI PICKER (generated)
    // =========================================================
    const EMOJI_LIST = [
      "😀","😃","😄","😁","😆","😅","🤣","😂","🙂","🙃","😉","😊","😇","🥰","😍","🤩","😘","😗","☺️","😚","😙",
      "🥲","😋","😛","😜","🤪","😝","🤑","🤗","🤭","🤫","🤔","🤐","🤨","😐","😑","😶","😏","😒","🙄","😬",
      "😌","😔","😪","🤤","😴","😷","🤒","🤕","🤢","🤮","🤧","🥵","🥶","🥴","😵","🤯","🥳","😎","🤓","🧐",
      "😕","😟","🙁","☹️","😮","😯","😲","😳","🥺","😦","😧","😨","😰","😥","😢","😭","😱","😖","😣","😞",
      "😓","😩","😫","🥱","😤","😡","😠","🤬","😈","👿","💀","☠️","💩","🤡","👻","👽","👾","🤖","👋","✋","🖖","👌","✌️","🤞","🤟","🤘","🤙","👍","👎","✊","👏","🙌","👐","🤝","🙏"
    ];

    function insertAtCursor(input, text) {
      const start = input.selectionStart;
      const end = input.selectionEnd;
      const before = input.value.substring(0, start);
      const after = input.value.substring(end);
      input.value = before + text + after;
      input.selectionStart = input.selectionEnd = start + text.length;
      input.focus();
    }

    function toggleEmojiPicker(show) {
      ui.emojiPicker.style.display = show ? "grid" : "none";
    }

    function buildEmojiPicker() {
      ui.emojiPicker.innerHTML = "";
      for (const e of EMOJI_LIST) {
        const div = document.createElement("div");
        div.className = "emoji-item";
        div.textContent = e;
        div.dataset.emoji = e;
        div.onclick = () => {
          insertAtCursor(ui.txtIn, e);
          toggleEmojiPicker(false);
        };
        ui.emojiPicker.appendChild(div);
      }
    }

    // =========================================================
    // APP FLOW
    // =========================================================
    function connect(isAuto) {
      if (!isAuto) {
        const n = document.getElementById("user-display-name").value.trim();
        const r = document.getElementById("room-code").value.trim().toUpperCase();
        if (!n) return alert("Enter Name");

        userData.name = n.substring(0, 8);
        userData.room = r || "SUCCESS";
        userData.gender = document.getElementById("user-gender").value;
        userData.language = ui.langSelect.value;

        joinTimestamp = Date.now();
        localStorage.setItem(SESSION_KEY, JSON.stringify({ ...userData, joinTime: joinTimestamp }));
      }

      ui.modal.classList.add("hidden");
      ui.app.classList.remove("opacity-0");

      document.getElementById("room-header-name").innerText = userData.room;
      document.getElementById("sidebar-room-name").innerText = userData.room;
      document.getElementById("user-display-meta").innerText =
        `${userData.name} • ${userData.gender} • ${userData.language.toUpperCase()}`;

      document.body.classList.add("mobile-chat-open");
      bindFirebase(userData.room);
    }

    // =========================================================
    // INIT
    // =========================================================
    // Language dropdown
    ui.langSelect.innerHTML = "";
    for (const label of fullLangList) {
      const opt = document.createElement("option");
      opt.value = langCodeMap[label] || "en";
      opt.text = (label === "Dutch") ? "Dutch Flemish" : label;
      if (label === "Dutch") opt.selected = true;
      ui.langSelect.add(opt);
    }

    buildEmojiPicker();

    // Modals
    window.toggleDeleteModal = (show) => ui.delModal.classList.toggle("hidden", !show);

    document.getElementById("confirm-delete-btn").onclick = () => {
      remove(ref(db, `chats/${userData.room}`));
      toggleDeleteModal(false);
      ui.msgWin.innerHTML = "";
      // also clear hands
      try { remove(ref(db, `hands/${userData.room}`)); } catch {}
    };

    // Logout
    ui.logout.onclick = () => {
      localStorage.removeItem(SESSION_KEY);
      location.reload();
    };

    // Enter
    document.getElementById("btn-connect").onclick = () => connect(false);

    // TTS toggle
    ui.ttsBtn.onclick = () => {
      ttsEnabled = !ttsEnabled;
      ui.ttsIcon.className = ttsEnabled ? "fa-solid fa-volume-high text-[#008069]" : "fa-solid fa-volume-xmark text-gray-400";
      if (ttsEnabled) processAudioQueue();
    };

    // Text input
    ui.txtIn.oninput = () => {
      const v = ui.txtIn.value.trim();
      ui.sendBtn.classList.toggle("hidden", v === "");
      ui.micBtn.classList.toggle("hidden", v !== "");
    };

    ui.sendBtn.onclick = () => {
      if (ui.txtIn.value.trim()) {
        pushMsg(ui.txtIn.value.trim(), true);
        ui.txtIn.value = "";
        ui.txtIn.oninput();
      }
    };

    // Mic
    ui.micBtn.onclick = startVoice;
    document.getElementById("stop-voice").onclick = () => stopVoice(true);
    document.getElementById("cancel-voice").onclick = () => stopVoice(false);

    // Emoji button
    ui.emojiBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      toggleEmojiPicker(ui.emojiPicker.style.display === "none" || ui.emojiPicker.style.display === "");
    });

    // Close emoji picker outside click
    document.addEventListener("click", (e) => {
      if (!ui.emojiPicker.contains(e.target) && e.target !== ui.emojiBtn) toggleEmojiPicker(false);
    });

    // Raise hand button (NOW WORKING)
    ui.raiseHandBtn.addEventListener("click", async (e) => {
      e.stopPropagation();
      await toggleHand();
    });

    // Sidebar hand buttons
    ui.handToggleBtn.onclick = () => toggleHand();
    ui.handLowerBtn.onclick = () => lowerHand();

    // History clear
    ui.clearHistoryBtn.onclick = () => {
      historyItems.length = 0;
      persistHistory();
      scheduleHistoryRender();
    };

    // Check saved session
    const saved = localStorage.getItem(SESSION_KEY);
    if (saved) {
      try {
        const d = JSON.parse(saved);
        userData = d;
        joinTimestamp = d.joinTime || Date.now();
        connect(true);
      } catch {}
    }
  </script>
</body>
