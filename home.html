<script>
// Speech recognition setup
let recognition;
let isListening = false;
let sttActive = false;

// Initialize speech recognition
if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = 'en-US';

  recognition.onresult = (event) => {
    let interimTranscript = '';
    let finalTranscript = '';
    
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const transcript = event.results[i][0].transcript;
      if (event.results[i].isFinal) {
        finalTranscript += transcript;
      } else {
        interimTranscript += transcript;
      }
    }
    
    if (interimTranscript) {
      document.getElementById('stt-caption').textContent = interimTranscript;
      document.getElementById('stt-bar').style.display = 'flex';
    }
    
    if (finalTranscript) {
      document.getElementById('stt-caption').textContent = finalTranscript;
      
      // Send the final transcript as a message
      if (window.app && window.app.sendSTTMessage) {
        window.app.sendSTTMessage(finalTranscript);
      }
      
      // Clear the interim text after a short delay
      setTimeout(() => {
        if (!isListening) {
          document.getElementById('stt-bar').style.display = 'none';
        }
      }, 500);
    }
  };

  recognition.onerror = (event) => {
    console.error('Speech recognition error:', event.error);
    isListening = false;
    updateMicButton();
    document.getElementById('stt-bar').style.display = 'none';
    sttActive = false;
    document.getElementById('background-processing').style.display = 'none';
  };

  recognition.onend = () => {
    if (isListening) {
      // If we're still supposed to be listening, restart
      recognition.start();
    } else {
      updateMicButton();
      document.getElementById('stt-bar').style.display = 'none';
      sttActive = false;
      document.getElementById('background-processing').style.display = 'none';
    }
  };
} else {
  console.warn('Speech recognition not supported in this browser');
  document.getElementById('mic-btn').style.display = 'none';
}

function updateMicButton() {
  const micBtn = document.getElementById('mic-btn');
  if (isListening) {
    micBtn.innerHTML = '<i class="fas fa-circle-stop text-xl text-red-500"></i>';
    micBtn.classList.add('mic-live');
  } else {
    micBtn.innerHTML = '<i class="fas fa-microphone text-xl"></i>';
    micBtn.classList.remove('mic-live');
  }
}

document.getElementById('mic-btn').addEventListener('click', () => {
  if (!recognition) {
    showToast('Speech recognition not supported in this browser', 'error');
    return;
  }

  if (isListening) {
    recognition.stop();
    isListening = false;
    sttActive = false;
    document.getElementById('background-processing').style.display = 'none';
  } else {
    recognition.start();
    isListening = true;
    sttActive = true;
    document.getElementById('background-processing').style.display = 'block';
    updateMicButton();
  }
});

document.getElementById('stt-cancel').addEventListener('click', () => {
  if (isListening) {
    recognition.stop();
    isListening = false;
    sttActive = false;
    document.getElementById('stt-bar').style.display = 'none';
    document.getElementById('background-processing').style.display = 'none';
    updateMicButton();
  }
});

function showToast(message, type = 'info') {
  Toastify({
    text: message,
    duration: 2800,
    gravity: "top",
    position: "right",
    className: `custom-toast ${type}`,
    stopOnFocus: true,
    style: {
      background:
        type === 'error' ? '#ef4444' :
        type === 'success' ? '#10b981' :
        type === 'warning' ? '#f59e0b' : '#3b82f6'
    }
  }).showToast();
}

// Handle visibility change to maintain STT in background
document.addEventListener('visibilitychange', () => {
  if (sttActive && document.hidden) {
    // Show background processing indicator
    document.getElementById('background-processing').style.display = 'block';
  } else {
    // Hide background processing indicator when tab is visible
    if (!sttActive) {
      document.getElementById('background-processing').style.display = 'none';
    }
  }
});

// Escape HTML function
function escapeHtml(s) {
  return String(s ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

// Clean transcript function
function cleanTranscript(t) {
  return String(t ?? "")
    .replace(/\b(uhm|um|ah|huh|er|eh|hm|uh)\b/gi, "")
    .replace(/\s\s+/g, " ")
    .trim();
}

class SuccesClassApp {
  constructor() {
    this.myUserId = null;
    this.userData = { name: '', room: 'SUCCESS', gender: 'Male', language: 'nl' };
    this.ttsEnabled = false;
    this.joinTimestamp = null;

    // STT runtime
    this.stt = {
      isOn: false,
      stream: null,
      recorder: null,
      dg: null,
      dgConn: null,
      lastFinalTs: 0,
      lastInterim: ""
    };

    this.ui = {
      gatewayModal: document.getElementById('gateway-modal'),
      appContainer: document.getElementById('app-container'),
      textInput: document.getElementById('text-input'),
      sendBtn: document.getElementById('send-btn'),
      micBtn: document.getElementById('mic-btn'),
      ttsBtn: document.getElementById('tts-toggle-btn'),
      ttsIcon: document.getElementById('tts-icon'),
      logoutBtn: document.getElementById('logout-btn'),
      clearChatBtn: document.getElementById('clear-chat-btn'),
      msgStream: document.getElementById('msg-stream'),
      roomHeaderName: document.getElementById('room-header-name'),
      userDisplayMeta: document.getElementById('user-display-meta'),
      sidebarRoomName: document.getElementById('sidebar-room-name'),
      backToSidebar: document.getElementById('back-to-sidebar'),
      sttBar: document.getElementById('stt-bar'),
      sttCaption: document.getElementById('stt-caption'),
      sttCancel: document.getElementById('stt-cancel'),
    };

    this.raisedHandNotification = document.getElementById('raised-hand-notification');
    this.raisedHandText = document.getElementById('raised-hand-text');

    this.setupEventListeners();
    this.populateLanguageDropdown();
  }

  setupEventListeners() {
    document.getElementById('btn-connect').addEventListener('click', () => this.connect());
    document.getElementById('logout-btn').addEventListener('click', () => this.logout());

    this.ui.backToSidebar?.addEventListener('click', () => {
      document.body.classList.remove('mobile-chat-open');
    });

    this.ui.textInput.addEventListener('input', () => this.handleInputChange());
    this.ui.textInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        this.sendTextMessage();
      }
    });

    this.ui.sendBtn.addEventListener('click', () => this.sendTextMessage());
    this.ui.ttsBtn.addEventListener('click', () => this.toggleTTS());
    this.ui.clearChatBtn.addEventListener('click', () => this.clearChat());
    document.getElementById('emoji-btn').addEventListener('click', () => this.raiseHand());

    // STT overlay stop
    this.ui.sttCancel.addEventListener('click', () => this.stopSTT({ discardInterim: true }));
  }

  populateLanguageDropdown() {
    const languages = [
      "Dutch", "English", "Filipino", "Spanish", "French", "German", "Arabic", "Korean", "Japanese", "Portuguese", "Hindi", "Tamil", "Telugu", "Russian", "Italian", "Chinese (Simplified)", "Chinese (Traditional)"
    ];

    const select = document.getElementById('user-lang');
    select.innerHTML = '';

    for (const lang of languages) {
      const option = document.createElement('option');
      option.value = this.getLanguageCode(lang);
      option.textContent = lang;
      if (lang === "Dutch") option.selected = true;
      select.appendChild(option);
    }
  }

  getLanguageCode(languageName) {
    const codeMap = {
      "English": "en", "Spanish": "es", "French": "fr", "German": "de", "Dutch": "nl",
      "Chinese (Simplified)": "zh-CN", "Chinese (Traditional)": "zh-TW",
      "Japanese": "ja", "Korean": "ko", "Hindi": "hi", "Arabic": "ar", "Italian": "it",
      "Portuguese": "pt", "Russian": "ru", "Filipino": "tl", "Tagalog": "tl",
      "Tamil": "ta", "Telugu": "te"
    };
    return codeMap[languageName] || "en";
  }

  async connect() {
    const name = document.getElementById('user-display-name').value.trim();
    const room = document.getElementById('room-code').value.trim().toUpperCase();
    if (!name) {
      this.showToast('Please enter a display name', 'error');
      return;
    }

    this.userData = {
      name: name.substring(0, 20),
      room: room || 'SUCCESS',
      gender: document.getElementById('user-gender').value,
      language: document.getElementById('user-lang').value
    };

    this.myUserId = `user-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`;
    this.joinTimestamp = Date.now();

    this.ui.gatewayModal.classList.add('hidden');
    this.ui.appContainer.classList.remove('opacity-0');

    this.ui.roomHeaderName.textContent = this.userData.room;
    this.ui.sidebarRoomName.textContent = this.userData.room;
    this.ui.userDisplayMeta.textContent = `${this.userData.name} • ${this.userData.gender} • ${this.userData.language.toUpperCase()}`;

    document.getElementById('user-initial').textContent = this.userData.name.charAt(0).toUpperCase();
    document.getElementById('user-name').textContent = this.userData.name;

    document.body.classList.add('mobile-chat-open');

    await this.initializeChat();
    this.showToast(`Welcome to ${this.userData.room}!`, 'success');
  }

  async initializeChat() {
    this.ui.msgStream.innerHTML = '';
    this.setupFirebaseListeners();
  }

  setupFirebaseListeners() {
    // In a real implementation, this would listen to Firebase
    console.log("Setting up Firebase listeners...");
  }

  showToast(message, type = 'info') {
    Toastify({
      text: message,
      duration: 2800,
      gravity: "top",
      position: "right",
      className: `custom-toast ${type}`,
      stopOnFocus: true,
      style: {
        background:
          type === 'error' ? '#ef4444' :
          type === 'success' ? '#10b981' :
          type === 'warning' ? '#f59e0b' : '#3b82f6'
      }
    }).showToast();
  }

  handleInputChange() {
    const hasText = this.ui.textInput.value.trim() !== '';
    this.ui.sendBtn.classList.toggle('hidden', !hasText);
  }

  scrollToBottom() {
    setTimeout(() => {
      this.ui.msgStream.scrollTop = this.ui.msgStream.scrollHeight;
    }, 50);
  }

  renderMessage(message, isOwnMessage) {
    if (message.isRaisedHand) return;

    const messageDiv = document.createElement('div');
    messageDiv.className = `flex ${isOwnMessage ? 'justify-end' : 'justify-start'} animate-slide-in`;

    const displayText = escapeHtml(message.text || "");
    const time = new Date(message.timestamp || Date.now());
    const timeString = time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    const metaLang = escapeHtml((message.lang || "").toUpperCase());
    const metaGender = escapeHtml(message.gender || "");
    const metaName = escapeHtml(message.senderName || "Unknown");

    messageDiv.innerHTML = `
      <div class="${isOwnMessage ? 'bg-[#d9fdd3] rounded-tr-none' : 'bg-white rounded-tl-none'}
        p-3 rounded-2xl bubble-shadow max-w-[85%] md:max-w-[70%]
        ${isOwnMessage ? 'border-l-4 border-[#00a884]' : 'border-l-4 border-blue-400'}">
        <div class="flex-1">
          ${!isOwnMessage ? `
            <div class="flex items-center gap-2 mb-1">
              <span class="text-xs font-bold text-gray-700">${metaName}</span>
              <span class="text-[10px] text-gray-500">${metaGender} • ${metaLang}</span>
              ${message.source === "stt" ? `<span class="text-[10px] px-2 py-0.5 bg-emerald-50 text-emerald-700 rounded-full font-bold">STT</span>` : ``}
            </div>
          ` : ''}
          <p class="text-[14.5px] text-[#111b21] leading-relaxed whitespace-pre-wrap break-words">${displayText}</p>
          <div class="flex items-center justify-between mt-2 pt-2 border-t border-gray-100/50">
            <div class="flex items-center gap-2">
              <span class="text-[10px] text-gray-400">${timeString}</span>
              <div class="emotion-emoji" title="${escapeHtml(message.emotion || 'neutral')}">
                ${escapeHtml(message.emoji || '😐')}
              </div>
            </div>
          </div>
        </div>
      </div>
    `;

    this.ui.msgStream.appendChild(messageDiv);
    this.scrollToBottom();
  }

  async sendTextMessage() {
    const text = this.ui.textInput.value.trim();
    if (!text) return;

    const message = {
      text,
      senderId: this.myUserId,
      senderName: this.userData.name,
      gender: this.userData.gender,
      lang: this.userData.language,
      emoji: '💬',
      emotion: 'neutral',
      timestamp: Date.now(),
      messageId: `msg-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`
    };

    this.renderMessage(message, true);

    // In a real implementation, this would send to Firebase
    console.log("Sending message:", message);

    this.ui.textInput.value = '';
    this.handleInputChange();
  }

  // ======= RAISE HAND (kept as-is) =======
  raiseHand() {
    const message = {
      text: "raised their hand",
      senderId: this.myUserId,
      senderName: this.userData.name,
      gender: this.userData.gender,
      lang: this.userData.language,
      emoji: "✋",
      emotion: "neutral",
      timestamp: Date.now(),
      messageId: `hand-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`,
      isRaisedHand: true
    };

    // In a real implementation, this would send to Firebase
    console.log("Sending hand raise:", message);

    this.showRaisedHandNotification(this.userData.name);
  }

  showRaisedHandNotification(name) {
    this.raisedHandText.textContent = `${name} raised their hand!`;
    this.raisedHandNotification.classList.add('show');
    setTimeout(() => this.raisedHandNotification.classList.remove('show'), 2800);
  }

  toggleTTS() {
    this.ttsEnabled = !this.ttsEnabled;
    this.ui.ttsIcon.className = this.ttsEnabled
      ? "fas fa-volume-high text-[#008069]"
      : "fas fa-volume-mute text-gray-400";
    this.showToast(this.ttsEnabled ? 'Text-to-speech enabled' : 'Text-to-speech disabled', this.ttsEnabled ? 'success' : 'info');
    
    // If TTS is enabled, we'll implement text-to-speech functionality
    if (this.ttsEnabled) {
      this.setupTTS();
    }
  }

  setupTTS() {
    // Enable TTS for messages
    console.log("TTS setup complete");
  }

  speakText(text) {
    if ('speechSynthesis' in window && this.ttsEnabled) {
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = this.userData.language;
      utterance.rate = 1.0;
      utterance.pitch = 1.0;
      utterance.volume = 1.0;
      speechSynthesis.speak(utterance);
    }
  }

  async clearChat() {
    // In a real implementation, this would clear the Firebase database
    this.ui.msgStream.innerHTML = '';
    this.showToast('Chat cleared successfully', 'success');
  }

  logout() {
    if (confirm('Are you sure you want to logout?')) {
      location.reload();
    }
  }

  // =========================================================
  // ✅ FIXED STT (Browser Native Speech Recognition)
  // - mic button toggles start/stop
  // - interim shows as live caption bar (local only)
  // - finals are sent as messages (per final segment)
  // =========================================================
  async toggleSTT() {
    if (this.stt.isOn) {
      await this.stopSTT({ discardInterim: false });
      return;
    }
    await this.startSTT();
  }

  async startSTT() {
    if (!this.userData?.room) {
      this.showToast("Join a room first.", "error");
      return;
    }

    if (!recognition) {
      this.showToast("Speech recognition not supported in this browser", "error");
      return;
    }

    try {
      // Start recognition
      recognition.lang = this.userData.language;
      recognition.start();
      this.stt.isOn = true;
      isListening = true;
      sttActive = true;
      
      // Update UI
      this._sttUI(true, "Listening…");
      document.getElementById('background-processing').style.display = 'block';
      
      this.showToast("STT started", "success");
    } catch (e) {
      console.error("STT start error:", e);
      this.showToast("Microphone permission denied or unavailable.", "error");
      this._sttUI(false);
      this.stt.isOn = false;
      isListening = false;
      sttActive = false;
      document.getElementById('background-processing').style.display = 'none';
    }
  }

  async stopSTT({ discardInterim }) {
    try {
      this.stt.isOn = false;
      isListening = false;
      sttActive = false;
      
      if (recognition) {
        recognition.stop();
      }
      
      if (discardInterim) this.ui.sttCaption.textContent = "";
      this._sttUI(false);
      document.getElementById('background-processing').style.display = 'none';
      
      this.showToast("STT stopped", "info");
    } catch (e) {
      console.error("STT stop error:", e);
      this._sttUI(false);
      document.getElementById('background-processing').style.display = 'none';
    }
  }

  _sttUI(on, caption = "") {
    if (on) {
      this.ui.sttBar.style.display = "flex";
      this.ui.sttCaption.textContent = caption || "";
      this.ui.micBtn.classList.add("mic-live");
      this.ui.micBtn.querySelector("i")?.classList.remove("fa-microphone");
      this.ui.micBtn.querySelector("i")?.classList.add("fa-circle-stop");
    } else {
      this.ui.sttBar.style.display = "none";
      this.ui.sttCaption.textContent = "";
      this.ui.micBtn.classList.remove("mic-live");
      this.ui.micBtn.querySelector("i")?.classList.add("fa-microphone");
      this.ui.micBtn.querySelector("i")?.classList.remove("fa-circle-stop");
    }
  }

  async sendSTTMessage(text) {
    const t = cleanTranscript(text);
    if (!t) return;

    const emotion = "neutral";
    const message = {
      text: t,
      senderId: this.myUserId,
      senderName: this.userData.name,
      gender: this.userData.gender,
      lang: this.userData.language,
      emoji: "🎙️",
      emotion,
      timestamp: Date.now(),
      messageId: `stt-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`,
      source: "stt"
    };

    // local render immediately
    this.renderMessage(message, true);

    // In a real implementation, this would send to Firebase
    console.log("Sending STT message:", message);
  }
}

document.addEventListener('DOMContentLoaded', () => {
  window.app = new SuccesClassApp();
});
</script>
</body>
